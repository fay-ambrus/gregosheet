name: Tests
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.3"

      - uses: leafo/gh-actions-luarocks@v4

      - run: luarocks install busted

      - run: busted
